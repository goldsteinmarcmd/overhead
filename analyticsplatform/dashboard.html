<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Analytics Platform</title>
  <style>
    :root {
      --bg: #05080f;
      --panel: #0b1220;
      --ink: #e8eef7;
      --muted: #8b9bb3;
      --line: rgba(232, 238, 247, 0.12);
      --accent: #4cc9f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Source Sans 3", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.03em; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    select {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.45rem 0.7rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem;
    }
    .card .label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .card .value { font-size: 1.6rem; font-weight: 700; margin-top: 0.35rem; font-variant-numeric: tabular-nums; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    section h2 { margin: 0 0 0.75rem; font-size: 0.95rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    td, th { padding: 0.35rem 0; border-bottom: 1px solid var(--line); text-align: left; }
    td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .bar {
      height: 6px;
      background: rgba(76,201,240,.15);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 0.75rem;
    }
    .bar > i { display: block; height: 100%; background: var(--accent); }
    .chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 90px;
      margin-top: 0.5rem;
    }
    .chart span {
      flex: 1;
      background: var(--accent);
      opacity: 0.85;
      border-radius: 3px 3px 0 0;
      min-width: 2px;
    }
    .err { color: #ef476f; }
    .loading { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Analytics platform</h1>
      <div class="sub" id="meta">Loading…</div>
    </div>
    <div>
      <label>
        Project
        <select id="site"><option value="all">All projects</option></select>
      </label>
      <label>
        Range
        <select id="days">
          <option value="7">7 days</option>
          <option value="28" selected>28 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
    </div>
  </header>

  <div class="cards" id="cards"></div>
  <div class="grid" id="grid"></div>

  <script>
    const daysEl = document.getElementById('days');
    const siteEl = document.getElementById('site');
    const cardsEl = document.getElementById('cards');
    const gridEl = document.getElementById('grid');
    const metaEl = document.getElementById('meta');

    async function load() {
      metaEl.textContent = 'Loading…';
      cardsEl.innerHTML = '';
      gridEl.innerHTML = '<p class="loading">Querying BigQuery…</p>';
      try {
        const params = new URLSearchParams({ days: daysEl.value, site: siteEl.value });
        const res = await fetch(`/api/summary?${params}`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      } catch (e) {
        metaEl.innerHTML = `<span class="err">${e.message}</span>`;
        gridEl.innerHTML = '';
      }
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString();
    }

    function pct(n) {
      return `${(Number(n || 0) * 100).toFixed(1)}%`;
    }

    function render(data) {
      const when = data.refreshed_at
        ? new Date(data.refreshed_at).toLocaleTimeString()
        : 'now';
      const scope = data.site === 'all' ? 'all projects' : data.site;
      metaEl.textContent = `${scope} · last ${data.days} days · refreshed ${when} · auto every 30s`;
      cardsEl.innerHTML = [
        ['Unique viewers', fmt(data.users)],
        ['Sessions', fmt(data.sessions)],
        ['Pageviews', fmt(data.pageviews)],
        ['Clicks', fmt(data.clicks)],
        ['Unique clickers', fmt(data.click_users)],
        ['Bounce rate', pct(data.bounce_rate)],
      ].map(([label, value]) => `
        <div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>
      `).join('');

      const maxDaily = Math.max(1, ...(data.daily || []).map((d) => Number(d.views || 0)));
      const chart = (data.daily || []).map((d) => {
        const h = Math.max(2, (Number(d.views || 0) / maxDaily) * 100);
        return `<span title="${d.day}: ${d.views}" style="height:${h}%"></span>`;
      }).join('');

      gridEl.innerHTML = `
        ${projectSection(data.projects)}
        <section>
          <h2>Pageviews / day</h2>
          <div class="chart">${chart || '<p class="loading">No data yet</p>'}</div>
        </section>
        ${clickSection(data.top_clicks)}
        ${listSection('Top pages', data.pages)}
        ${listSection('Top referrers', data.referrers)}
        ${listSection('Countries', data.countries)}
        ${listSection('Devices', data.devices)}
        ${listSection('Events', data.events)}
        ${listSection('Campaigns (UTM)', data.campaigns)}
        ${(data.satellites || []).length ? satSection(data.satellites) : ''}
      `;
    }

    function projectSection(rows) {
      if (!(rows || []).length) return '';
      return `<section style="grid-column:1/-1">
        <h2>Projects</h2>
        <table>
          <tr><th>Project</th><th>Unique viewers</th><th>Pageviews</th><th>Clicks</th></tr>
          ${(rows || []).map((r) => `<tr>
            <td>${escapeHtml(r.site_id)}</td><td>${fmt(r.users)}</td>
            <td>${fmt(r.pageviews)}</td><td>${fmt(r.clicks)}</td>
          </tr>`).join('')}
        </table>
      </section>`;
    }

    function clickSection(rows) {
      const body = (rows || []).length
        ? `<table><tr><th>Target</th><th>Clicks</th><th>Unique</th></tr>
          ${(rows || []).map((r) => `<tr>
            <td>${escapeHtml(r.outbound_host || r.target)}</td>
            <td>${fmt(r.clicks)}</td><td>${fmt(r.unique_users)}</td>
          </tr>`).join('')}</table>`
        : '<p class="loading">No click data yet</p>';
      return `<section><h2>Top clicks</h2>${body}</section>`;
    }

    function satSection(rows) {
      const max = Math.max(1, ...(rows || []).map((r) => Number(r.clicks || 0)));
      const body = (rows || []).length
        ? `<table>
            <tr><th>Satellite</th><th>Clicks</th><th>Unique</th></tr>
            ${(rows || []).map((r) => {
              const label = r.name
                ? `${escapeHtml(r.name)} <span style="color:var(--muted);font-size:.75rem">NORAD ${escapeHtml(r.norad)}</span>`
                : `NORAD ${escapeHtml(r.norad)}`;
              return `
              <tr>
                <td>${label}</td>
                <td>${fmt(r.clicks)}</td>
                <td>${fmt(r.unique_users)}</td>
              </tr>
              <tr><td colspan="3"><div class="bar"><i style="width:${(Number(r.clicks || 0) / max) * 100}%"></i></div></td></tr>
            `;
            }).join('')}
          </table>`
        : '<p class="loading">No satellite clicks yet</p>';
      return `<section style="grid-column:1/-1"><h2>Top satellites clicked</h2>${body}</section>`;
    }

    function listSection(title, rows) {
      const max = Math.max(1, ...(rows || []).map((r) => Number(r.count || 0)));
      const body = (rows || []).length
        ? `<table>${(rows || []).map((r) => `
            <tr>
              <td>${escapeHtml(r.name)}</td>
              <td>${fmt(r.count)}</td>
            </tr>
            <tr><td colspan="2"><div class="bar"><i style="width:${(Number(r.count || 0) / max) * 100}%"></i></div></td></tr>
          `).join('')}</table>`
        : '<p class="loading">No data yet</p>';
      return `<section><h2>${title}</h2>${body}</section>`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function init() {
      try {
        const res = await fetch('/api/sites', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          for (const site of data.sites || []) {
            siteEl.add(new Option(site, site));
          }
        }
      } catch {}
      load();
    }

    daysEl.addEventListener('change', load);
    siteEl.addEventListener('change', load);
    init();
    setInterval(load, 30_000);
  </script>
</body>
</html>
